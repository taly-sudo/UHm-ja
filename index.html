<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gtra6 — Media Gallery</title>
<style>
  :root{
    --bg:#111214; --panel:#191b1e; --panel-2:#202327; --line:#2c3035;
    --text:#e9eaec; --muted:#9aa0a6; --accent:#e9eaec;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px}

  header.top{
    position:sticky;top:0;z-index:50;
    background:rgba(17,18,20,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0}
  .brand{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
  .brand span{color:var(--muted);font-weight:400;margin-left:10px;font-size:13px}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;width:220px;outline:none;
  }
  .search:focus{border-color:#4a5057}
  .search::placeholder{color:var(--muted)}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    background:none;border:0;color:var(--muted);font:inherit;font-size:13px;
    padding:7px 14px;cursor:pointer;
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#31363c;color:var(--text)}

  nav.colls{position:sticky;top:57px;z-index:40;border-bottom:1px solid var(--line);background:rgba(17,18,20,.92);backdrop-filter:blur(10px)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:thin}
  .chips a{
    flex:0 0 auto;text-decoration:none;font-size:12.5px;color:var(--muted);
    border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;
    white-space:nowrap;
  }
  .chips a:hover{color:var(--text);border-color:#454b52}

  section.coll{padding:38px 0 8px;scroll-margin-top:118px}
  .coll h2{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .coll p.desc{margin:0 0 4px;color:var(--muted);font-size:13.5px;max-width:70ch}
  .coll .count{color:#6f757b;font-size:12px;margin:0 0 18px}

  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;
  }
  .card:hover{border-color:#4a5057;transform:translateY(-2px)}
  .thumb{position:relative;aspect-ratio:16/10;background:#0d0e10;overflow:hidden}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .badge{
    position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);
    font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:5px;color:#dfe2e5;
  }
  .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .play i{
    width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;
  }
  .play i::after{
    content:"";border-left:13px solid #fff;border-top:8px solid transparent;
    border-bottom:8px solid transparent;margin-left:4px;
  }
  .meta{padding:11px 13px 13px}
  .meta .t{font-size:13.5px;font-weight:500;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .s{font-size:12px;color:var(--muted);margin-top:3px}

  .empty{color:var(--muted);padding:60px 0;text-align:center;display:none}

  footer{border-top:1px solid var(--line);margin-top:56px;padding:22px 0 40px;color:#6f757b;font-size:12.5px}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(8,9,10,.96);display:none;
      flex-direction:column;padding:18px}
  .lb.on{display:flex}
  .lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .lb-bar{display:flex;align-items:flex-start;gap:16px;padding:14px 4px 2px;color:var(--muted);font-size:13px}
  .lb-bar .txt{flex:1;min-width:0}
  .lb-bar .txt b{display:block;color:var(--text);font-weight:500;font-size:14px}
  .lb-bar .txt em{font-style:normal;color:#6f757b;font-size:12px;word-break:break-all}
  .lb-btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto;
  }
  .lb-btn:hover{background:#31363c}
  .lb-nav{display:flex;gap:8px;align-items:center}
  @media (max-width:640px){
    .wrap{padding:0 16px}
    .search{width:100%}
    .controls{width:100%}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">gtra6 <span id="totals"></span></div>
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="Search…" autocomplete="off">
      <div class="seg" id="filter">
        <button data-f="all" class="on">All</button>
        <button data-f="photo">Photos</button>
        <button data-f="video">Videos</button>
      </div>
    </div>
  </div>
</header>

<nav class="colls"><div class="wrap"><div class="chips" id="chips"></div></div></nav>

<main class="wrap" id="main"></main>
<div class="empty wrap" id="empty">Nothing matches that.</div>

<footer class="wrap">Local gallery — media copied from the gtra6 folder. Originals untouched.</footer>

<div class="lb" id="lb">
  <div class="lb-stage" id="lbStage"></div>
  <div class="wrap lb-bar">
    <div class="txt">
      <b id="lbTitle"></b>
      <span id="lbSub"></span> · <em id="lbFile"></em>
    </div>
    <div class="lb-nav">
      <button class="lb-btn" id="lbPrev" title="Previous (←)">‹</button>
      <button class="lb-btn" id="lbNext" title="Next (→)">›</button>
      <button class="lb-btn" id="lbClose" title="Close (Esc)">✕</button>
    </div>
  </div>
</div>

<script src="media.js"></script>
<script>
(function(){
  var G = window.GALLERY || [];
  var flat = [];
  G.forEach(function(c){ c.items.forEach(function(it){ it.coll = c.name; it.idx = flat.length; flat.push(it); }); });

  var nPhoto = flat.filter(function(i){return i.type==='photo';}).length;
  document.getElementById('totals').textContent =
    nPhoto + ' photos · ' + (flat.length - nPhoto) + ' videos · ' + G.length + ' collections';

  var main = document.getElementById('main');
  var chips = document.getElementById('chips');

  G.forEach(function(c){
    var a = document.createElement('a');
    a.href = '#' + c.slug;
    a.textContent = c.name + ' (' + c.items.length + ')';
    chips.appendChild(a);

    var sec = document.createElement('section');
    sec.className = 'coll'; sec.id = c.slug; sec.dataset.slug = c.slug;
    var bits = [];
    if (c.photos) bits.push(c.photos + (c.photos === 1 ? ' photo' : ' photos'));
    if (c.videos) bits.push(c.videos + (c.videos === 1 ? ' video' : ' videos'));
    sec.innerHTML = '<h2></h2><p class="desc"></p><p class="count">' + bits.join(' · ') + '</p><div class="grid"></div>';
    sec.querySelector('h2').textContent = c.name;
    sec.querySelector('p.desc').textContent = c.desc;
    var grid = sec.querySelector('.grid');

    c.items.forEach(function(it){
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.type = it.type;
      card.dataset.hay = (it.title + ' ' + it.coll + ' ' + it.file).toLowerCase();
      var thumb;
      if (it.type === 'photo') {
        thumb = '<div class="thumb"><img loading="lazy" src="' + it.path + '" alt=""><span class="badge">Photo</span></div>';
      } else {
        thumb = '<div class="thumb"><video preload="metadata" muted playsinline src="' + it.path + '#t=0.5"></video>' +
                '<span class="badge">Video · ' + it.mb + ' MB</span><span class="play"><i></i></span></div>';
      }
      card.innerHTML = thumb + '<div class="meta"><div class="t"></div><div class="s"></div></div>';
      card.querySelector('.t').textContent = it.title;
      card.querySelector('.s').textContent = it.label;
      card.addEventListener('click', function(){ open(it.idx); });
      grid.appendChild(card);
    });
    main.appendChild(sec);
  });

  /* filtering */
  var filter = 'all', query = '';
  function apply(){
    var any = false;
    document.querySelectorAll('section.coll').forEach(function(sec){
      var shown = 0;
      sec.querySelectorAll('.card').forEach(function(card){
        var ok = (filter === 'all' || card.dataset.type === filter) &&
                 (!query || card.dataset.hay.indexOf(query) > -1);
        card.style.display = ok ? '' : 'none';
        if (ok) shown++;
      });
      sec.style.display = shown ? '' : 'none';
      if (shown) any = true;
    });
    document.getElementById('empty').style.display = any ? 'none' : 'block';
  }
  document.getElementById('filter').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
    filter = b.dataset.f; apply();
  });
  document.getElementById('q').addEventListener('input', function(){
    query = this.value.trim().toLowerCase(); apply();
  });

  /* lightbox */
  var lb = document.getElementById('lb'), stage = document.getElementById('lbStage'), cur = -1;
  function visible(){
    return flat.filter(function(it){
      return (filter === 'all' || it.type === filter) &&
             (!query || (it.title + ' ' + it.coll + ' ' + it.file).toLowerCase().indexOf(query) > -1);
    });
  }
  function open(i){
    cur = i;
    var it = flat[i];
    stage.innerHTML = '';
    var el;
    if (it.type === 'photo') { el = document.createElement('img'); el.src = it.path; }
    else { el = document.createElement('video'); el.src = it.path; el.controls = true; el.autoplay = true; el.playsInline = true; }
    stage.appendChild(el);
    document.getElementById('lbTitle').textContent = it.title;
    document.getElementById('lbSub').textContent = it.coll + ' · ' + it.label;
    document.getElementById('lbFile').textContent = it.file;
    lb.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('on'); stage.innerHTML = ''; document.body.style.overflow = '';
  }
  function step(d){
    var v = visible(); if (!v.length) return;
    var pos = v.findIndex(function(x){ return x.idx === cur; });
    if (pos === -1) pos = 0; else pos = (pos + d + v.length) % v.length;
    open(v[pos].idx);
  }
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ step(1); });
  lb.addEventListener('click', function(e){ if (e.target === lb || e.target === stage) close(); });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  apply();
})();
</script>
</body>
</html>
